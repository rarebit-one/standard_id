en:
  standard_id:
    passwordless_mailer:
      otp_email:
        # Used only when c.passwordless.mailer_subject is not assigned.
        subject: "Your sign-in code"
        greeting: "Hi,"
        intro: "Use the following code to sign in:"
        expiry:
          one: "This code will expire in %{count} minute."
          other: "This code will expire in %{count} minutes."
        ignore: "If you did not request this code, you can safely ignore this email."
        footer: "This is an automated message. Please do not reply."
      verification_email:
        subject: "Your verification code"
        greeting: "Hi,"
        intro: "Use the following code to complete your verification:"
        expiry:
          one: "This code will expire in %{count} minute."
          other: "This code will expire in %{count} minutes."
        ignore: "If you did not request this code, you can safely ignore this email."
        footer: "This is an automated message. Please do not reply."
    account_notice_mailer:
      existing_account:
        subject: "Someone tried to sign up with your email"
        greeting: "Hi,"
        intro: "Someone just tried to create an account with this email address, but you already have one."
        action: "If that was you, sign in the way you did before, or reset your password if you have forgotten it."
        ignore: "If it wasn't you, you can safely ignore this email. Your account has not changed."
        footer: "This is an automated message. Please do not reply."
