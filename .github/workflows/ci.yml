name: CI

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  # Shared gem CI (lint + Ruby matrix + rolled-up `test` aggregator), like the
  # rest of the standard_* family. Required checks: `ci / lint`, `ci / test`.
  ci:
    uses: rarebit-one/.github/.github/workflows/reusable-gem-ci.yml@v2
    with:
      ruby-versions: '["4.0.0","4.0.1","4.0.2","4.0.3","4.0.4"]'
      lint-ruby-version: "4.0.4"
      lint-command: bin/rubocop -f github
      extra-lint-commands: |
        bin/brakeman --no-pager
        bundle exec bundler-audit --update
      apt-packages: "build-essential git libyaml-dev pkg-config google-chrome-stable"
      pre-test-commands: |
        bin/rails db:test:prepare
        bin/rails app:tailwindcss:build
      upload-screenshots: true

  # The suite again on PostgreSQL, which every consumer app runs (DBP-022).
  # The matrix above is SQLite, so it never runs the migrations' PG-only
  # branches (jsonb, GIN, partial and CONCURRENTLY indexes), the advisory
  # lock in Passwordless, or a PG query plan. On this leg spec/rails_helper.rb
  # builds the schema by running every migration instead of loading the
  # SQLite-dumped schema.rb. Same pattern as standard_audit's `test (postgres)`.
  #
  # A separate job because the reusable gem CI has no `services:` hook.
  test-postgres:
    name: test (postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16-alpine@sha256:44c4ee9810eff91f7eab4d822642e01115b1a9eccce4bcbdde7604752d68eac6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: standard_id_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
          --mount type=tmpfs,destination=/var/lib/postgresql/data
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/standard_id_test
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libyaml-dev pkg-config

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: 4.0.4
          bundler-cache: true

      - name: Run tests on PostgreSQL
        run: bundle exec rspec

  test-rails-edge:
    # Early-warning canary against Rails `main`. Non-blocking: this job is allowed
    # to fail without breaking PRs. The point is to surface upstream breakage in
    # development rather than at a host app's `bundle update` after a Rails 9
    # release. The open-ended `>= 8.1` constraint in standard_id.gemspec means
    # Rails 9+ will be auto-resolved by host bundlers once published, so we want
    # to know about incompatibilities early. (Kept outside the reusable workflow
    # on purpose: it rewrites the Gemfile, which the shared CI has no hook for.)
    name: test (rails-edge)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - name: Install packages
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y build-essential git libyaml-dev pkg-config google-chrome-stable

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Pin Rails to main in Gemfile
        run: |
          cat >> Gemfile <<'RUBY'

          # Override Rails to edge for the rails-edge canary job (CI only).
          gem "rails", github: "rails/rails", branch: "main"
          RUBY
          # Drop the lockfile so bundler resolves edge versions cleanly.
          rm -f Gemfile.lock

      - name: Set up Ruby
        uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1.334.0
        with:
          ruby-version: 4.0.4
          bundler-cache: false

      - name: Install dependencies against Rails edge
        run: bundle install --jobs 4 --retry 3

      - name: Run tests against Rails edge
        env:
          RAILS_ENV: test
        run: |
          bin/rails db:test:prepare
          bin/rails app:tailwindcss:build
          bundle exec rspec

      - name: Keep screenshots from failed system tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: screenshots-rails-edge
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
